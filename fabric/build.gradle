plugins { id 'com.gradleup.shadow' }
architectury {
    platformSetupLoomIde()
    fabric()
}
loom {
    // Share the merged access widener defined in :common.
    accessWidenerPath = project(":common").loom.accessWidenerPath
}
configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}
dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    modImplementation("maven.modrinth:immersive-messages-api:fabric-${rootProject.minecraft_version}-${rootProject.immersive_messages_version}") { transitive = false }
    modImplementation "maven.modrinth:txnilib:fabric-${rootProject.minecraft_version}-${rootProject.txnilib_version}"
    // Immersive Messages embeds this jar, but Loom drops nested-jar declarations while remapping.
    // Keep it explicit so Fabric development/runtime classloading can resolve NeoForge config shims.
    modImplementation "maven.modrinth:forge-config-api-port:${rootProject.forge_config_api_port_version}"
    implementation "com.electronwill.night-config:core:${rootProject.night_config_version}"
    implementation "com.electronwill.night-config:toml:${rootProject.night_config_version}"
    // Merged from Settlers.
    modImplementation "software.bernie.geckolib:geckolib-fabric-${rootProject.minecraft_version}:${rootProject.geckolib_version}"
    modApi "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    // ModMenu — compile-only: the entrypoint only loads when ModMenu is installed at runtime.
    modCompileOnly "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version, minecraft_version: rootProject.minecraft_version,
            fabric_loader_version: rootProject.fabric_loader_version) }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { injectAccessWidener = true; input.set shadowJar.archiveFile; archiveClassifier = null; dependsOn shadowJar }
